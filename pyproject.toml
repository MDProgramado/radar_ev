[tool.poetry]
name = "radar-ev"
version = "1.0.0"
description = "Sistema de recomendação pré-jogo para identificação de apostas com valor esperado positivo (+EV) em mercados estatísticos de futebol"
authors = ["Maicon Douglas <maicon@example.com>"]
readme = "README.md"
packages = [{include = "radar_ev", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
pydantic = "^2.5"
pydantic-settings = "^2.1"
structlog = "^24.1"
python-dotenv = "^1.0"
httpx = "^0.27"
tenacity = "^9.1"
python-telegram-bot = "^22.7"
scipy = "^1.14"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
pytest-cov = "^5.0"
pytest-httpx = "^0.30"
ruff = "^0.3"
mypy = "^1.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
radar-ev = "radar_ev.orchestrator:main"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
