
[tool.poetry]
name = "radar-ev"
version = "0.1.0"
description = "Bot quantitativo de análise esportiva"
authors = ["Seu Nome <seuemail@example.com>"]
readme = "README.md"
packages = [{include = "radar_ev", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
pydantic = "^2.5"
pydantic-settings = "^2.1"
structlog = "^24.1"
python-dotenv = "^1.0"
httpx = "^0.27"
tenacity = "^9.1.4"
python-telegram-bot = "^22.7"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
pytest-cov = "^5.0"
ruff = "^0.3"
mypy = "^1.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = false
disallow_untyped_defs = true
